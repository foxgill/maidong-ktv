name: Build Maidong KTV APK
run-name: Build APK from source
on:
  workflow_dispatch: # 【重点】支持手动点击运行
  push:
    branches: [ main ] # 往main分支提交代码时自动编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Android SDK dependencies
        run: |
          flutter config --no-analytics
          flutter doctor
          yes | flutter doctor --android-licenses

      - name: Fetch flutter dependencies
        run: flutter pub get

      - name: Build Android arm64 release APK (TV盒子)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload compiled APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maidong-ktv-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
